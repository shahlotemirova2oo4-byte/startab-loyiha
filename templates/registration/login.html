{% extends 'base.html' %}

{% block title %}Kirish — StartUp.uz{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="form-section">
        <h1 class="h3 fw-bold mb-4 text-center">
          <i class="bi bi-box-arrow-in-right text-primary"></i> Kirish
        </h1>

        <form method="post" novalidate>
          {% csrf_token %}

          {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
          {% endif %}

          <div class="mb-3">
            <label class="form-label">{{ form.username.label }}</label>
            {{ form.username }}
          </div>

          <div class="mb-3">
            <label class="form-label">{{ form.password.label }}</label>
            {{ form.password }}
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">Kirish</button>

          <div class="text-center text-muted">
            Akkountingiz yo'qmi?
            <a href="{% url 'accounts:register' %}">Ro'yxatdan o'tish</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
